<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>마이페이지</title>

<style>

body{
    font-family: Arial;
    margin:40px;
}

.container{
    width:450px;
}

h2{
    margin-top:30px;
}

label{
    display:block;
    margin-top:10px;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
}

button{
    margin-top:20px;
    padding:10px;
    width:100%;
}

.section{
    border:1px solid #ddd;
    padding:20px;
    margin-bottom:20px;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<h1>마이페이지</h1>

<form action="/mypage/update" method="post">

<div class="section">

<h2>기본 정보 수정</h2>

<label>ID</label>
<input type="text" name="login_id" value="{{login_id}}" readonly>

<label>비밀번호</label>
<input type="password" name="password" placeholder="새 비밀번호 입력">

<label>이름</label>
<input type="text" name="name" value="{{name}}">

<label>생년월일</label>
<input type="date" name="birth" value="{{birth}}">

<label>전화번호</label>
<input type="text" name="phone" value="{{phone}}">

</div>


<div class="section">

<h2>드론 제원 수정</h2>

<label>드론 무게</label>
<input type="text" name="weight" value="{{weight}}">

<label>드론 크기</label>
<input type="text" name="size" value="{{size}}">

<label>최대 이륙중량</label>
<input type="text" name="max_takeoff_weight" value="{{max_takeoff_weight}}">

</div>

<button type="submit">정보 수정</button>

</form>

</div>

</body>
</html>
