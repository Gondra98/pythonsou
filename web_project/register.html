<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회원가입</title>

<style>

body{
    font-family: Arial;
    margin:40px;
}

.container{
    width:400px;
}

.section{
    border:1px solid #ddd;
    padding:20px;
    margin-bottom:20px;
    border-radius:8px;
}

label{
    display:block;
    margin-top:10px;
}

input{
    width:100%;
    padding:8px;
}

button{
    width:100%;
    padding:10px;
}

</style>

</head>

<body>

<div class="container">

<h2>회원가입</h2>

<form action="/register" method="post">

<div class="section">

<h3>기본 정보</h3>

<label>이름</label>
<input type="text" name="name" required>

<label>생년월일</label>
<input type="date" name="birth" required>

<label>전화번호</label>
<input type="text" name="phone" required>

<label>ID</label>
<input type="text" name="login_id" required>

<label>PW</label>
<input type="password" name="password" required>

</div>


<div class="section">

<h3>드론 제원</h3>

<label>드론 무게</label>
<input type="text" name="weight">

<label>드론 크기</label>
<input type="text" name="size">

<label>최대 이륙중량</label>
<input type="text" name="max_takeoff_weight">

</div>

<button type="submit">회원가입</button>

</form>

</div>

</body>
</html>
