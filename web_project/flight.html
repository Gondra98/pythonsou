<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>User Registration</title>

<style>
body{
    font-family: Arial;
    margin:40px;
}

form{
    width:400px;
}

label{
    display:block;
    margin-top:10px;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
}

button{
    margin-top:15px;
    padding:10px;
    width:100%;
}
</style>

</head>
<body>

<h2>회원가입</h2>

<form action="/register" method="post">

<label>로그인 아이디</label>
<input type="text" name="login_id" required>

<label>비밀번호</label>
<input type="password" name="password" required>

<label>이름</label>
<input type="text" name="name" required>

<label>생년월일</label>
<input type="date" name="birth">

<label>전화번호</label>
<input type="text" name="phone">

<button type="submit">회원가입</button>

</form>

</body>
</html>
